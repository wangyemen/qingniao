<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>不在 AI 工作区</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #11151d;
    --line: rgba(255, 255, 255, 0.08);
    --text: #e6edf3;
    --faint: #8b98a5;
    --teal: #2dd4bf;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 28px 22px; text-align: center; gap: 14px;
  }
  .icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.26);
  }
  .icon svg { width: 22px; height: 22px; fill: none; stroke: var(--amber); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  p { margin: 0; font-size: 12.5px; color: var(--faint); max-width: 260px; }
  button {
    margin-top: 4px; padding: 8px 16px; border-radius: 9px;
    border: 1px solid rgba(45, 212, 191, 0.4);
    background: rgba(45, 212, 191, 0.12);
    color: var(--teal); font-size: 12.5px; font-family: inherit;
    cursor: pointer; transition: background .16s ease, border-color .16s ease;
  }
  button:hover { background: rgba(45, 212, 191, 0.2); border-color: rgba(45, 212, 191, 0.7); }
  button:disabled { opacity: .5; cursor: default; }
  .tip { margin-top: 6px; font-size: 11.5px; color: #5f6b78; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z" /><path d="M12 9v5" /><circle cx="12" cy="17" r="0.5" /></svg>
    </div>
    <h1>这个标签页不在 AI 工作区</h1>
    <p>AI 看不到也不会操作它，所以这里不显示对话。<br />你可以让 AI 接管这个页面，或切回工作区里的标签页继续。</p>
    <button id="adoptBtn">让 AI 管理此标签页</button>
    <div class="tip" id="tip"></div>
  </div>
<script src="inactive.js"></script>
</body>
</html>
