<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>夹具 · 富文本与多行输入</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; padding: 24px; max-width: 760px; }
    h1 { font-size: 18px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 14px; margin: 12px 0; }
    #rt {
      min-height: 90px; border: 1px solid #bbb; border-radius: 8px; padding: 8px;
      white-space: pre-wrap; background: #fff;
    }
    textarea { width: 100%; min-height: 90px; }
    .hint { color: #666; font-size: 12px; }
  </style>
</head>
<body>
  <h1>富文本与多行输入</h1>
  <p class="hint">用来验证：多行内容会按行插入真正的换行，而不是被压成一行。</p>

  <div class="card">
    <div class="hint">富文本编辑器（contenteditable）</div>
    <div id="rt" contenteditable="true" aria-label="正文编辑器"></div>
    <div class="hint" id="rtInfo">行数：0</div>
  </div>

  <div class="card">
    <div class="hint">普通输入框（textarea）</div>
    <textarea id="ta" aria-label="备注输入框"></textarea>
    <div class="hint" id="taInfo">行数：0</div>
  </div>

  <script>
    var rt = document.getElementById("rt");
    var ta = document.getElementById("ta");
    function lines(s) {
      var t = String(s == null ? "" : s).replace(/\r\n?/g, "\n").trim();
      return t ? t.split("\n").filter(function (x) { return x.trim() !== ""; }).length : 0;
    }
    function refresh() {
      document.getElementById("rtInfo").textContent = "行数：" + lines(rt.innerText);
      document.getElementById("taInfo").textContent = "行数：" + lines(ta.value);
    }
    rt.addEventListener("input", refresh);
    ta.addEventListener("input", refresh);
    refresh();
    window.__fx = {
      get rtText() { return rt.innerText || ""; },
      get taText() { return ta.value || ""; },
      get rtLines() { return lines(rt.innerText); },
      get taLines() { return lines(ta.value); },
    };
  </script>
</body>
</html>
